name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Node 22 is the floor: the host SDK (pi-coding-agent) declares
      # engines.node >=22.19.0. Node 24 is what development runs on.
      #
      # The suite is hermetic: it drives in-memory sessions against a scripted
      # fake model, so it needs no credentials, no network, and costs nothing.
      # The live-model suite (test/live) is excluded from `npm test` and never
      # runs here.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
